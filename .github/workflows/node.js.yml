name: Node.js CI

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          
      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Build extension
        run: pnpm run build

      - name: Upload ZIP Release
        uses: actions/upload-artifact@v7
        with:
          path: dist/com.kureichi.discordrpc.zip
          archive: false

      - name: Upload ZXP Release
        uses: actions/upload-artifact@v7
        with:
          path: dist/com.kureichi.discordrpc.zxp
          archive: false
