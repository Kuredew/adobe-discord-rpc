name: Node.js CI

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Install dependencies (root)
        run: pnpm install

      - name: Install dependencies (scripts/dep)
        working-directory: scripts/dep
        run: pnpm install 

      - name: Build extension
        run: pnpm run build

      - name: Upload ZIP Release
        uses: actions/upload-artifact@v4
        with:
          path: dist/com.kureichi.discordrpc.zip

      - name: Upload ZXP Release
        uses: actions/upload-artifact@v4
        with:
          path: dist/com.kureichi.discordrpc.zxp
